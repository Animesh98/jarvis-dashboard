services:
  backend:
    build: ./backend
    container_name: jarvis-backend
    restart: unless-stopped
    env_file: .env
    volumes:
      # docker.sock is mounted read-write because /api/docker/action needs to
      # start/stop/restart containers. Trust model: every /api request must
      # carry the API_KEY (no localhost bypass), and the backend port is not
      # published — only the frontend container reaches it over the compose
      # network. Set API_KEY in .env; without it the API is open.
      - /var/run/docker.sock:/var/run/docker.sock
      - backend-data:/app/data

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8002
    container_name: jarvis-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  backend-data:
