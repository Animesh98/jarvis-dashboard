services:
  backend:
    image: ghcr.io/animesh98/jarvis-backend:latest
    container_name: jarvis-backend
    restart: unless-stopped
    env_file: .env
    volumes:
      # docker.sock is mounted read-write because /api/docker/action needs to
      # start/stop/restart containers. Trust model: the backend sits behind
      # the Next.js proxy on the same host (and the API_KEY middleware if
      # enabled), so the socket is never reachable from the network.
      - /var/run/docker.sock:/var/run/docker.sock
      - backend-data:/app/data
    ports:
      - "8002:8002"

  frontend:
    image: ghcr.io/animesh98/jarvis-frontend:latest
    container_name: jarvis-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  backend-data:
